name: Hourly data refresh

on:
  schedule:
    # :07 past the hour, not :00 — avoids GitHub's top-of-hour scheduler
    # congestion, which is when scheduled runs are most likely to be delayed.
    - cron: "7 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run refresh script
        run: node scripts/refresh.mjs

      - name: Commit updated data.json
        run: |
          git config user.name "avalanche-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Automated hourly data refresh"
          git push
